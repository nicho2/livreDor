name: Non-regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-regression-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Compilation dédiée Sites
        run: npm run build:sites
      - run: npm run typecheck
      - name: Migrations et droits RLS sur PostgreSQL isolé
        run: psql -X -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/local-bootstrap.sql
        env:
          PGPASSWORD: local-regression-only
      - name: Quota en créations simultanées
        run: node scripts/test-quota-concurrency.mjs 5432
        env:
          PGPASSWORD: local-regression-only
